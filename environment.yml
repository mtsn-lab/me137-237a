name: me137-237a-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - jupyter
  - jupyterlab
  - ipykernel
  - numpy
  - scipy
  - matplotlib
  - pandas
  - sympy
  - scikit-learn
  - seaborn
  - openpyxl
  - pint
  - tensorflow=2.15.0      # Added for Keras-based CNNs and LSTMs
  - gymnasium       # Added for Reinforcement Learning environments
  - pip
  - pip:
    - CoolProp
    - pyCalor
    - pyfluids
    - nbstripout
    - stable-baselines3 # Added for out-of-the-box RL algorithms
    - gekko             # Added for Model Predictive Control optimization